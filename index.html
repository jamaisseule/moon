<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Moon</title>
    <link
      rel="icon"
      href="https://i.pinimg.com/originals/fa/86/97/fa869743d08ca95414a50cc0ec1526bd.png"
      type="image/png"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="cursor-tail"></div>
    <img
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/moon2.png"
      alt=""
    />
    <div class="stars"></div>
    <div class="moon-background"></div>
    <div class="moon-background"></div>
    <div class="typing-text" id="typing-text"></div>

    <script>
      const numStars = 100;
      for (let i = 0; i < numStars; i++) {
        createStar(i);
      }

      function createStar(index) {
        const star = document.createElement("div");
        star.classList.add("star");
        star.style.zIndex = Math.random() > 0.5 ? "2" : "0";
        star.style.top = Math.random() * 100 + "%";
        star.style.left = Math.random() * 100 + "%";
        star.style.animationDelay = Math.random() * 5 + "s";
        document.body.appendChild(star);
      }

      window.onload = () => {
        const text = "the moon is beautiful, isn't it?";
        const typingElement = document.getElementById("typing-text");
        let i = 0;
        const speed = 70;

        function typeChar() {
          if (i < text.length) {
            typingElement.textContent += text.charAt(i);
            i++;
            setTimeout(typeChar, speed);
          }
        }

        setTimeout(typeChar, 100);
      };
    </script>
  </body>
</html>
